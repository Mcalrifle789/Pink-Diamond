<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 108" width="520" height="108" role="img" aria-label="Pink Diamond">
  <defs>
    <linearGradient id="pdGem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3fb"/>
      <stop offset=".45" stop-color="#ffb6e2"/>
      <stop offset="1" stop-color="#f0479f"/>
    </linearGradient>
    <linearGradient id="pdInk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe8f6"/>
      <stop offset=".55" stop-color="#ffc3e8"/>
      <stop offset="1" stop-color="#ff8fd0"/>
